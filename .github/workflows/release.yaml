name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-engine:
    name: Build Engine
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements_engine.txt
          python -m pip install pywin32
          python -m pip install setuptools<70 --upgrade

      - name: Generate component files
        run: python -m app.engine.codegen.source_generator

      - name: Build with PyInstaller
        run: |
          cp ./utilities/build_tools/unemblem_engine.spec .
          python -m PyInstaller -y unemblem_engine.spec
          rm unemblem_engine.spec -fo

      - name: Package engine
        run: |
          mkdir unemblem
          mv dist/unemblem ./unemblem/lt_engine
          cp utilities/install/double_click_to_play.bat ./unemblem
          cp app/engine/item_system.py ./unemblem/unemblem/app/engine
          cp app/engine/skill_system.py ./unemblem/unemblem/app/engine
          echo ${{ github.sha }} > ./unemblem/unemblem/version.txt

      - name: Zip engine
        run: powershell Compress-Archive -Path unemblem -DestinationPath UnEmblem.zip

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-zip
          path: UnEmblem.zip
          retention-days: 7

  build-editor:
    name: Build Editor
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements_editor.txt
          python -m pip install pywin32
          python -m pip install setuptools<70 --upgrade

      - name: Generate component files
        run: python -m app.engine.codegen.source_generator

      - name: Build with PyInstaller
        run: |
          cp ./utilities/build_tools/editor.spec .
          python -m PyInstaller -y editor.spec
          rm editor.spec -fo

      - name: Package editor
        run: |
          mkdir lt_editor
          mv dist/lt_editor ./lt_editor/lt_editor
          cp utilities/install/double_click_to_run.bat ./lt_editor
          mv build/editor ./lt_editor/lt_editor
          cp -r default.ltproj ./lt_editor/lt_editor
          cp app/engine/item_system.py ./lt_editor/lt_editor/app/engine
          cp app/engine/skill_system.py ./lt_editor/lt_editor/app/engine
          echo ${{ github.sha }} > ./lt_editor/lt_editor/version.txt

      - name: Zip editor
        run: powershell Compress-Archive -Path lt_editor -DestinationPath UnEmblem_Editor.zip

      - name: Upload editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-zip
          path: UnEmblem_Editor.zip
          retention-days: 7

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-engine, build-editor]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files (debug)
        run: ls -la ./artifacts/*/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/engine-zip/UnEmblem.zip
            ./artifacts/editor-zip/UnEmblem_Editor.zip
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}